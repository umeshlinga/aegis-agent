[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agents"
version = "0.3.0"
description = "Aegis: a reliability runtime for AI agents that do real work (durable multi-agent execution, browser automation with verified effects, hybrid RAG, guardrails, evals)."
requires-python = ">=3.11"
authors = [{ name = "Umesh Linga" }]
dependencies = [
  "pydantic>=2.6", "httpx>=0.27", "anthropic>=0.40", "openai>=1.40", "fastapi>=0.110", "uvicorn>=0.29",
  "playwright>=1.45", "python-dotenv>=1.0", "numpy>=1.26", "scipy>=1.11", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
rag = ["fastembed>=0.4"]
mcp = ["mcp>=1.2"]  # 1.x (FastMCP) and 2.x (MCPServer) both supported
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "matplotlib>=3.8"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
