[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agent"
version = "0.1.0"
description = "Aegis: a permissioned tool-using agent runtime with checkpointed recovery, a multi-LLM router, full tracing, and an eval harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.40"]
# The provider adapters speak the providers' HTTP APIs with the standard
# library only, so they need no SDK dependency. The browser tool needs
# Playwright plus its Chromium build (playwright install chromium).
browser = ["playwright>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
